[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "emberloop"
version = "0.2.0"
description = "Start Codex five-hour usage windows with one tiny Luna turn"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{name = "abinzzz"}]
dependencies = []

[project.scripts]
emberloop = "codex_window.cli:main"
codex-window = "codex_window.cli:main"

[tool.setuptools.packages.find]
include = ["codex_window*"]
