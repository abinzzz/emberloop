 <path d="M3-2C18 11 27 25 17 41C10 54-9 55-17 40C-26 22-8 10 3-2Z" fill="#fff0ce"/>
</g>
<text x="76" y="84" fill="#ffae70" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="13" letter-spacing="4">SMALL REQUEST. CONTINUOUS RHYTHM.</text>
<text x="70" y="193" fill="#fff5e9" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="90" font-weight="750" letter-spacing="-4">Emberloop</text>
