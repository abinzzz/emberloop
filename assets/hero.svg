<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="420" viewBox="0 0 1280 420" role="img" aria-labelledby="title desc">
<title id="title">Emberloop — A tiny spark. Every five hours.</title>
<desc id="desc">A glowing orange ember inside an orbital loop on a dark background. A small Codex five-hour window starter.</desc>
<defs>
  <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#0c1018"/><stop offset="1" stop-color="#17120f"/></linearGradient>
  <linearGradient id="ember" x2="0.8" y2="1"><stop stop-color="#ffe7ae"/><stop offset=".45" stop-color="#ff9c4a"/><stop offset="1" stop-color="#ec4e27"/></linearGradient>
  <radialGradient id="halo"><stop stop-color="#ef6a2e" stop-opacity=".23"/><stop offset="1" stop-color="#ef6a2e" stop-opacity="0"/></radialGradient>
</defs>
<rect width="1280" height="420" rx="24" fill="url(#bg)"/>
<rect x="1" y="1" width="1278" height="418" rx="23" fill="none" stroke="#303039"/>
