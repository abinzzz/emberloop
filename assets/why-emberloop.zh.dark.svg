<svg xmlns="http://www.w3.org/2000/svg" width="960" height="460" viewBox="0 0 960 460" role="img" aria-labelledby="title desc">
  <title id="title">示意场景 · 两个窗口均为五小时</title>
  <desc id="desc">示例：上一窗口于 10:00 结束。未开启 Emberloop 时，12:00 首次使用，约 17:00 重置；开启后，10:00 后自动启动确认未开始的窗口，约 15:00 重置。两条时间线比例相同，均为五小时。电脑需唤醒且联网。</desc>
  <rect width="960" height="460" rx="24" fill="#161617"/>
  <g font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, PingFang SC, Microsoft YaHei, sans-serif">
  <text x="64" y="58" fill="#a1a1a6" font-size="27" font-weight="600" text-anchor="start">未开启 Emberloop</text>
  <text x="301.714" y="128" fill="#f5f5f7" font-size="34" font-weight="600" text-anchor="start">12:00</text>
  <text x="896" y="128" fill="#f5f5f7" font-size="34" font-weight="600" text-anchor="end">~17:00</text>
  <text x="301.714" y="197" fill="#a1a1a6" font-size="22" font-weight="400" text-anchor="start">首次使用</text>
  <text x="896" y="197" fill="#a1a1a6" font-size="22" font-weight="400" text-anchor="end">额度重置</text>
  <text x="64" y="234" fill="#ffad73" font-size="27" font-weight="600" text-anchor="start">开启 Emberloop</text>
  <text x="64" y="304" fill="#f5f5f7" font-size="34" font-weight="600" text-anchor="start">~10:00</text>
  <text x="658.286" y="304" fill="#f5f5f7" font-size="34" font-weight="600" text-anchor="end">~15:00</text>
  <text x="64" y="373" fill="#a1a1a6" font-size="22" font-weight="400" text-anchor="start">自动开启</text>
  <text x="658.286" y="373" fill="#a1a1a6" font-size="22" font-weight="400" text-anchor="end">额度重置</text>
  <text x="896" y="436" fill="#ffad73" font-size="24" font-weight="600" text-anchor="end">约提前 2 小时</text>
  </g>
  <g fill="none" stroke-linecap="round">
    <path d="M64 152H896" stroke="#363638" stroke-width="2"/>
    <path d="M301.714 152H896" stroke="#636367" stroke-width="10"/>
    <path d="M64 328H896" stroke="#363638" stroke-width="2"/>
    <path d="M64 328H658.286" stroke="#ffad73" stroke-width="10"/>
  </g>
  <g fill="#161617" stroke-width="3">
    <circle cx="301.714" cy="152" r="8" stroke="#636367"/>
    <circle cx="896" cy="152" r="8" stroke="#636367"/>
    <circle cx="64" cy="328" r="8" stroke="#ffad73"/>
    <circle cx="658.286" cy="328" r="8" stroke="#ffad73"/>
  </g>
</svg>
