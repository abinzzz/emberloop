<svg xmlns="http://www.w3.org/2000/svg" width="960" height="460" viewBox="0 0 960 460" role="img" aria-labelledby="title desc">
  <title id="title">Illustrative example · Both windows last five hours.</title>
  <desc id="desc">Example: a previous window ends at 10:00. Without Emberloop, first use at 12:00 starts a window ending around 17:00. Emberloop can start a confirmed unused window shortly after 10:00, ending around 15:00. Both bars use the same time scale and span five hours. Requires an awake, online computer.</desc>
  <rect width="960" height="460" rx="24" fill="#f5f5f7"/>
  <g font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, PingFang SC, Microsoft YaHei, sans-serif">
  <text x="64" y="58" fill="#6e6e73" font-size="27" font-weight="600" text-anchor="start">Without Emberloop</text>
  <text x="301.714" y="128" fill="#1d1d1f" font-size="34" font-weight="600" text-anchor="start">12:00</text>
  <text x="896" y="128" fill="#1d1d1f" font-size="34" font-weight="600" text-anchor="end">~17:00</text>
  <text x="301.714" y="197" fill="#6e6e73" font-size="22" font-weight="400" text-anchor="start">First use</text>
  <text x="896" y="197" fill="#6e6e73" font-size="22" font-weight="400" text-anchor="end">Reset</text>
  <text x="64" y="234" fill="#b94c23" font-size="27" font-weight="600" text-anchor="start">With Emberloop</text>
  <text x="64" y="304" fill="#1d1d1f" font-size="34" font-weight="600" text-anchor="start">~10:00</text>
  <text x="658.286" y="304" fill="#1d1d1f" font-size="34" font-weight="600" text-anchor="end">~15:00</text>
  <text x="64" y="373" fill="#6e6e73" font-size="22" font-weight="400" text-anchor="start">Auto-start</text>
  <text x="658.286" y="373" fill="#6e6e73" font-size="22" font-weight="400" text-anchor="end">Reset</text>
  <text x="896" y="436" fill="#b94c23" font-size="24" font-weight="600" text-anchor="end">About 2 hours earlier</text>
  </g>
  <g fill="none" stroke-linecap="round">
    <path d="M64 152H896" stroke="#dedee3" stroke-width="2"/>
    <path d="M301.714 152H896" stroke="#b5b5bd" stroke-width="10"/>
    <path d="M64 328H896" stroke="#dedee3" stroke-width="2"/>
    <path d="M64 328H658.286" stroke="#b94c23" stroke-width="10"/>
  </g>
  <g fill="#f5f5f7" stroke-width="3">
    <circle cx="301.714" cy="152" r="8" stroke="#b5b5bd"/>
    <circle cx="896" cy="152" r="8" stroke="#b5b5bd"/>
    <circle cx="64" cy="328" r="8" stroke="#b94c23"/>
    <circle cx="658.286" cy="328" r="8" stroke="#b94c23"/>
  </g>
</svg>
