<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="690" viewBox="0 0 1200 690" role="img" aria-labelledby="title desc">
 <defs><pattern id="hatch" width="10" height="10" patternUnits="userSpaceOnUse"><path d="M0 10L10 0" stroke="#d7dce2" stroke-width="1"/></pattern></defs>
 <rect width="1200" height="690" rx="20" fill="#fff"/><rect x="1" y="1" width="1198" height="688" rx="19" fill="none" stroke="#dce1e7"/>
 <g font-family="-apple-system,BlinkMacSystemFont,Segoe UI,PingFang SC,Microsoft YaHei,sans-serif">
<title id="title">Back at noon. Your next reset can be ~2 hours earlier.</title><desc id="desc">Example: the previous window ends at 10:00. First use starts the next window.Same allowance. Same five-hour window. Earlier start. Requires awake, online, confirmed-unstarted state.</desc>
<text x="48" y="65" font-size="31" fill="#15202d" font-weight="700" text-anchor="start">Back at noon. Your next reset can be ~2 hours earlier.</text>
<text x="48" y="105" font-size="19" fill="#596678" font-weight="400" text-anchor="start">Example: the previous window ends at 10:00. First use starts the next window.</text>
<line x1="260" y1="175" x2="260" y2="515" stroke="#e0e5ea" stroke-dasharray="4 6"/>
<text x="260" y="158" font-size="21" fill="#596678" font-weight="600" text-anchor="middle">10:00</text>
<line x1="500" y1="175" x2="500" y2="515" stroke="#e0e5ea" stroke-dasharray="4 6"/>
<text x="500" y="158" font-size="21" fill="#596678" font-weight="600" text-anchor="middle">12:00</text>
<line x1="860" y1="175" x2="860" y2="515" stroke="#e0e5ea" stroke-dasharray="4 6"/>
<text x="860" y="158" font-size="21" fill="#596678" font-weight="600" text-anchor="middle">15:00</text>
<line x1="1100" y1="175" x2="1100" y2="515" stroke="#e0e5ea" stroke-dasharray="4 6"/>
<text x="1100" y="158" font-size="21" fill="#596678" font-weight="600" text-anchor="middle">17:00</text>
<text x="48" y="279" font-size="21" fill="#596678" font-weight="650" text-anchor="start">Without Emberloop</text>
<rect x="260" y="246" width="240" height="52" rx="7" fill="url(#hatch)"/><rect x="500" y="246" width="600" height="52" rx="7" fill="#64748b"/>
<text x="380" y="279" font-size="19" fill="#596678" font-weight="500" text-anchor="middle">Not started</text>
<text x="800" y="279" font-size="22" fill="#fff" font-weight="650" text-anchor="middle">5-hour window</text>
<text x="500" y="226" font-size="18" fill="#283344" font-weight="400" text-anchor="start">12:00  You send a request</text>
<text x="1100" y="331" font-size="19" fill="#475569" font-weight="650" text-anchor="end">Reset ~17:00</text>
<circle cx="500" cy="272" r="7" fill="#fff" stroke="#475569" stroke-width="3"/><circle cx="1100" cy="272" r="7" fill="#fff" stroke="#475569" stroke-width="3"/>
<text x="48" y="442" font-size="21" fill="#b84b16" font-weight="700" text-anchor="start">With Emberloop</text>
<rect x="260" y="409" width="600" height="52" rx="7" fill="#df601f"/>
<text x="260" y="389" font-size="18" fill="#b84b16" font-weight="600" text-anchor="start">Just after 10:00: a tiny auto-request</text>
<text x="570" y="442" font-size="22" fill="#fff" font-weight="650" text-anchor="middle">5-hour window</text>
<circle cx="260" cy="435" r="7" fill="#fff" stroke="#b84b16" stroke-width="3"/><circle cx="860" cy="435" r="7" fill="#fff" stroke="#b84b16" stroke-width="3"/>
<text x="500" y="493" font-size="18" fill="#475569" font-weight="500" text-anchor="middle">12:00  You return</text>
<text x="860" y="493" font-size="19" fill="#b84b16" font-weight="700" text-anchor="middle">Reset ~15:00</text>
<path d="M875 435H1095M885 428L875 435L885 442M1085 428L1095 435L1085 442" fill="none" stroke="#b84b16" stroke-width="2"/>
<text x="985" y="414" font-size="20" fill="#b84b16" font-weight="700" text-anchor="middle">~2h earlier</text>
<rect x="48" y="544" width="1104" height="79" rx="12" fill="#fff3e9"/>
<text x="600" y="592" font-size="25" fill="#a44214" font-weight="700" text-anchor="middle">Start the clock while you are away from the keyboard.</text>
<text x="48" y="659" font-size="15" fill="#687485" font-weight="400" text-anchor="start">Same allowance. Same five-hour window. Earlier start. Requires awake, online, confirmed-unstarted state.</text>
</g></svg>