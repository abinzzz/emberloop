<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="700" viewBox="0 0 1280 700" role="img" aria-labelledby="title desc">
<defs><linearGradient id="warm" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#231810"/><stop offset="1" stop-color="#131315"/></linearGradient><linearGradient id="ember"><stop stop-color="#fb923c"/><stop offset="1" stop-color="#fdba74"/></linearGradient></defs>
<title id="title">Start earlier. Reset earlier.</title>
<desc id="desc">Example: previous window ends at 10:00; you return at noon. Manual start resets around 17:00. Automatic start resets around 15:00. Same allowance and five-hour duration.</desc>
<rect x="0" y="0" width="1280" height="700" rx="24" fill="#0c0c0f" stroke="none"/>
<rect x="1" y="1" width="1278" height="698" rx="23" fill="none" stroke="#29292e"/>
<g font-family="-apple-system,BlinkMacSystemFont,Segoe UI,PingFang SC,Microsoft YaHei,sans-serif">
<text x="48" y="49" font-size="14" fill="#fb923c" font-weight="600" text-anchor="start">EMBERLOOP  /  WHY IT EXISTS</text>
<text x="48" y="110" font-size="46" fill="#fafafa" font-weight="650" text-anchor="start">Start earlier. Reset earlier.</text>
<text x="48" y="150" font-size="20" fill="#a1a1aa" font-weight="400" text-anchor="start">Your window ends at 10:00. You return at noon. What happens in between?</text>
<rect x="48" y="190" width="580" height="337" rx="16" fill="#141417" stroke="#2b2b31"/>
<text x="76" y="232" font-size="18" fill="#d4d4d8" font-weight="600" text-anchor="start">WITHOUT EMBERLOOP</text>
<text x="76" y="306" font-size="64" fill="#e4e4e7" font-weight="600" text-anchor="start">17:00</text>
<text x="313" y="299" font-size="18" fill="#d4d4d8" font-weight="400" text-anchor="start">next reset</text>
<text x="76" y="347" font-size="20" fill="#a1a1aa" font-weight="400" text-anchor="start">The clock starts when you send a request.</text>
<path d="M76 413H600" stroke="#333338" stroke-width="3"/>
<path d="M225.71428571428572 413H600" stroke="#d4d4d8" stroke-width="4" stroke-linecap="round"/>
<path d="M76 413H225.71428571428572" stroke="#71717a" stroke-width="2" stroke-dasharray="3 6"/>
<circle cx="225.71428571428572" cy="413" r="5" fill="#141417" stroke="#d4d4d8" stroke-width="2"/>
<circle cx="600" cy="413" r="5" fill="#141417" stroke="#d4d4d8" stroke-width="2"/>
<text x="412.8571428571429" y="393" font-size="15" fill="#d4d4d8" font-weight="500" text-anchor="middle">5 hours</text>
<text x="76.0" y="445" font-size="15" fill="#a1a1aa" font-weight="400" text-anchor="middle">10:00</text>
<text x="225.71428571428572" y="445" font-size="15" fill="#a1a1aa" font-weight="400" text-anchor="middle">12:00</text>
<text x="450.28571428571433" y="445" font-size="15" fill="#a1a1aa" font-weight="400" text-anchor="middle">15:00</text>
<text x="600.0" y="445" font-size="15" fill="#a1a1aa" font-weight="400" text-anchor="middle">17:00</text>
<text x="76" y="494" font-size="17" fill="#d4d4d8" font-weight="500" text-anchor="start">Manual start at 12:00</text>
<text x="600" y="494" font-size="17" fill="#d4d4d8" font-weight="600" text-anchor="end">2h before starting</text>
<rect x="652" y="190" width="580" height="337" rx="16" fill="url(#warm)" stroke="#664125"/>
<text x="680" y="232" font-size="18" fill="#fdba74" font-weight="600" text-anchor="start">WITH EMBERLOOP</text>
<text x="680" y="306" font-size="64" fill="#ffb56b" font-weight="600" text-anchor="start">15:00</text>
<text x="917" y="299" font-size="18" fill="#fdba74" font-weight="400" text-anchor="start">next reset</text>
<text x="680" y="347" font-size="20" fill="#a1a1aa" font-weight="400" text-anchor="start">A tiny request starts the clock for you.</text>
<path d="M680 413H1204" stroke="#333338" stroke-width="3"/>
<path d="M680 413H1054.2857142857142" stroke="#fdba74" stroke-width="4" stroke-linecap="round"/>
<circle cx="680" cy="413" r="5" fill="#141417" stroke="#fdba74" stroke-width="2"/>
<circle cx="1054.2857142857142" cy="413" r="5" fill="#141417" stroke="#fdba74" stroke-width="2"/>
<text x="867.1428571428571" y="393" font-size="15" fill="#fdba74" font-weight="500" text-anchor="middle">5 hours</text>
<text x="680.0" y="445" font-size="15" fill="#a1a1aa" font-weight="400" text-anchor="middle">10:00</text>
<text x="829.7142857142858" y="445" font-size="15" fill="#a1a1aa" font-weight="400" text-anchor="middle">12:00</text>
<text x="1054.2857142857142" y="445" font-size="15" fill="#a1a1aa" font-weight="400" text-anchor="middle">15:00</text>
<text x="1204.0" y="445" font-size="15" fill="#a1a1aa" font-weight="400" text-anchor="middle">17:00</text>
<text x="680" y="494" font-size="17" fill="#fdba74" font-weight="500" text-anchor="start">Auto-start just after 10:00</text>
<text x="1204" y="494" font-size="17" fill="#fdba74" font-weight="600" text-anchor="end">~2h earlier</text>
<text x="48" y="581" font-size="28" fill="#f4f4f5" font-weight="600" text-anchor="start">Let the clock run while you are away.</text>
<text x="48" y="618" font-size="18" fill="#a1a1aa" font-weight="400" text-anchor="start">Same allowance. Same five hours. One tiny request uses a little quota.</text>
<path d="M48 644H1232" stroke="#29292e"/>
<text x="48" y="675" font-size="14" fill="#8b8b96" font-weight="400" text-anchor="start">Illustrates a first-request-started window. Requires an awake, online computer and a confirmed unstarted window.</text>
</g></svg>